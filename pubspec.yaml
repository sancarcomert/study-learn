name: study_planner
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  google_fonts: ^6.3.0
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  collection: ^1.19.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  uuid: ^4.4.0
  intl: ^0.19.0
  confetti: ^0.7.0
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  permission_handler: ^11.3.1
  path_provider: ^2.1.4
  share_plus: ^10.1.4
  file_picker: ^8.1.6
  home_widget: ^0.9.4
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/icon/icon.png
    - assets/ranks/
    # Lora + Plus Jakarta Sans TTF'leri asset olarak gömülü. google_fonts
    # eşleşen dosya adlarını (Lora-SemiBold.ttf, PlusJakartaSans-Medium.ttf …)
    # bulunca HTTP ile indirmiyor — offline'da (zayıf mobil veri) çalışır.
    # Dosya adlarını DEĞİŞTİRME: google_fonts bunları isimle eşleştiriyor.
    - assets/fonts/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  # Android 8+ adaptive icon: launcher'lar (daire/squircle/köşeli kare)
  # kendi maskesini uyguluyor — güvenli bölgenin (canvas'ın ~%66'sı) dışında
  # kalan içerik kırpılabiliyor. Bu yüzden foreground, icon.png'nin küçültülmüş
  # (scale=0.72), TAMAMEN AYRI bir versiyonu — düz icon.png'yi burada
  # kullanırsak altın nokta bazı launcher'larda kırpılırdı.
  adaptive_icon_background: "#5B35B5"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

flutter_native_splash:
  color: "#0F1115"
  image: "assets/icon/icon.png"